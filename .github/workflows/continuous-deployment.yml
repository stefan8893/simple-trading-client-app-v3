name: Continuous Deployment

on:
  push:
    tags: ["**"]

jobs:
  metadata:
    name: Extract Metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Extract version from tag
        id: extract_version
        run: |
          $Version = $env:GITHUB_REF -replace 'refs/tags/', ''
          Write-Host "Version: $Version"
          echo "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Validate SemVer version
        run: |
          $Version = "${{ steps.extract_version.outputs.version }}"

          if ($Version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$') {
            Write-Error "Version '$Version' is not a valid SemVer."
            EXIT -1
          } else {
            Write-Host "Version '$Version' is a valid SemVer. "
          }

  test:
    runs-on: ubuntu-latest
    name: Test
    needs: metadata
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js with pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

  package:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: [metadata, test]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            Version=${{ needs.metadata.outputs.version }}

  deploy:
    name: Deploy Container to Azure
    runs-on: ubuntu-latest
    needs: package
    permissions:
      id-token: write
      contents: read
    environment:
      name: Production
    env:
      AzureAppName: "simple-trading"
    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AzureAppName }}
          images: ${{ needs.package.outputs.image }}

  cleanup:
    name: Delete Old Container Images
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      packages: write
    steps:
      - name: Delete old container image versions
        uses: actions/github-script@v9
        with:
          script: |
            const packageName = context.payload.repository.name.toLowerCase();
            const owner = context.repo.owner;
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              {
                package_type: "container",
                package_name: packageName,
                username: owner,
              }
            );

            const versionsToDelete = versions
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(10);

            for (const version of versionsToDelete) {
              await github.rest.packages.deletePackageVersionForUser({
                package_type: "container",
                package_name: packageName,
                username: owner,
                package_version_id: version.id,
              });
              core.info(`Deleted container package version ${version.id}`);
            }
